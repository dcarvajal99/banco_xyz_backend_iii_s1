spring.application.name=banco-xyz-batch

# ---------------------------------------------------------------------------
# Base de datos destino de la migracion (PostgreSQL en Docker, puerto 5433).
# La misma base guarda los metadatos de Spring Batch (tablas BATCH_*), que son
# las que permiten reanudar un Job caido y auditar el historial de corridas.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/banco_xyz
spring.datasource.username=banco
spring.datasource.password=banco123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Spring Batch
#   initialize-schema=always -> crea las tablas BATCH_* si no existen.
#   job.enabled=false        -> los Jobs no se ejecutan solos al arrancar; los
#                               lanza LanzadorDeJobs segun el parametro --job.
# ---------------------------------------------------------------------------
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ---------------------------------------------------------------------------
# Reglas de negocio y rendimiento de la migracion
# ---------------------------------------------------------------------------
banco.batch.tamano-chunk=100
banco.batch.limite-omisiones=1000
banco.batch.limite-reintentos=3
banco.batch.umbral-monto-atipico=2500
banco.batch.tasa-ahorro=0.00500
banco.batch.tasa-prestamo=0.01500
banco.batch.tasa-hipoteca=0.00900
banco.batch.bonificacion-tercera-edad=0.00100
banco.batch.simular-fallo-transitorio=false

# ---------------------------------------------------------------------------
# Log de consola: formato compacto, pensado para leer el resumen de la corrida
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bancoxyz=INFO
logging.level.org.springframework.batch=INFO
# El lanzador repite los JobParameters completos en dos lineas; el resumen propio ya los muestra.
logging.level.org.springframework.batch.core.launch.support=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5p){highlight} %m%n
